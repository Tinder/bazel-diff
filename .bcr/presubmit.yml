matrix:
  bazel:
  - 8.x
  - 9.x
tasks:
  verify_targets_debian10:
    name: Verify build targets (Debian 10)
    platform: debian10
    bazel: ${{ bazel }}
    build_targets:
    - '@bazel-diff//:bazel-diff'
    - '@bazel-diff//:bazel-diff-rust'
  verify_targets_ubuntu2004:
    name: Verify build targets (Ubuntu 20.04)
    platform: ubuntu2004
    bazel: ${{ bazel }}
    build_targets:
    - '@bazel-diff//:bazel-diff'
    - '@bazel-diff//:bazel-diff-rust'
  verify_targets_macos_arm64:
    name: Verify build targets (macOS ARM64)
    platform: macos_arm64
    bazel: ${{ bazel }}
    build_targets:
    - '@bazel-diff//:bazel-diff'
    - '@bazel-diff//:bazel-diff-rust'
  verify_targets_windows_8x:
    name: Verify build targets (Windows, Bazel 8.x)
    platform: windows
    bazel: "8.x"
    build_flags:
    - '--legacy_external_runfiles'
    - '--host_platform=@bazel-diff//platforms:windows_msvc'
    # Keep exec paths under MAX_PATH (rules_rs#270). The root .bazelrc does
    # this for bazel-diff's own builds, but a dependent's build never reads
    # it, and the default "x64_windows-opt-exec-..." output directory pushes
    # the Rust toolchain's rlib paths past 260 characters on Bazel CI.
    - '--experimental_platform_in_output_dir'
    - '--experimental_override_name_platform_in_output_dir=@bazel-diff//platforms:windows_msvc=w'
    build_targets:
    - '@bazel-diff//:bazel-diff'
    - '@bazel-diff//:bazel-diff-rust'
  verify_targets_windows_9x:
    name: Verify build targets (Windows, Bazel 9.x)
    platform: windows
    bazel: "9.x"
    build_flags:
    - '--legacy_external_runfiles'
    - '--host_platform=@bazel-diff//platforms:windows_msvc'
    # Keep exec paths under MAX_PATH (rules_rs#270). The root .bazelrc does
    # this for bazel-diff's own builds, but a dependent's build never reads
    # it, and the default "x64_windows-opt-exec-..." output directory pushes
    # the Rust toolchain's rlib paths past 260 characters on Bazel CI.
    - '--experimental_platform_in_output_dir'
    - '--experimental_override_name_platform_in_output_dir=@bazel-diff//platforms:windows_msvc=w'
    build_targets:
    - '@bazel-diff//:bazel-diff'
    - '@bazel-diff//:bazel-diff-rust'
bcr_test_module:
  module_path: ""
  matrix:
    platform:
    - ubuntu2004
    - macos_arm64
    bazel:
    - 8.x
    - 9.x
  tasks:
    run_tests:
      name: Run test
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
      - '//:bazel-diff-rust'
      test_targets:
      - '//:rust_tests'
