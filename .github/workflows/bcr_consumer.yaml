name: BCR consumer

# Mirror the Bazel Central Registry presubmit for bazel-diff on a PR, so a
# release that the registry would reject fails here first:
#
# 1. Build bazel-diff as a non-root module from the release source archive,
#    using the same platforms, flags and targets as .bcr/presubmit.yml.
# 2. Rebuild once per incompatible flag the registry tests for that Bazel
#    version (bazel-central-registry/incompatible_flags.yml), as BCR does
#    before it lets a registry PR merge.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  verify-targets:
    name: Consume as dependency (${{ matrix.os }}, Bazel ${{ matrix.bazel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the platforms and bazel matrix in .bcr/presubmit.yml.
        os: [ubuntu-latest, windows-latest]
        bazel: ['8.x', '9.x']
    defaults:
      run:
        shell: bash
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
      # Prevent Git Bash from rewriting Bazel target labels as Windows paths.
      MSYS2_ARG_CONV_EXCL: '//'
    steps:
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
      - name: Setup Bazelisk
        run: |
          go install github.com/bazelbuild/bazelisk@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Resolve the temp directory for bash
        # On Windows RUNNER_TEMP is "D:\a\_temp"; GNU tar reads the drive
        # colon as a remote host and bash needs forward slashes.
        run: |
          tmp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then
            tmp=$(cygpath -u "$RUNNER_TEMP")
          fi
          echo "TMP=$tmp" >> "$GITHUB_ENV"
      - name: Pack release archive
        run: .github/workflows/pack_release_archive.sh "$TMP/release.tar.gz"
      - name: Set up consumer module
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            url="file:///$(cygpath -m "$TMP")/release.tar.gz"
          else
            url="file://$TMP/release.tar.gz"
          fi
          mkdir -p "$TMP/consumer"
          cd "$TMP/consumer"
          cat > MODULE.bazel <<EOF
          module(name = "bcr-consumer-check")

          # archive_override replaces this version with the release archive.
          bazel_dep(name = "bazel-diff", version = "0.0.0")

          archive_override(
              module_name = "bazel-diff",
              urls = ["$url"],
          )
          EOF
          touch BUILD.bazel
      - name: Set Bazel flags
        # Keep in sync with the build_flags of the matching task in
        # .bcr/presubmit.yml. The startup flag keeps Windows output paths short
        # on GitHub runners, as the other Windows jobs do.
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            echo "BAZEL_STARTUP_FLAGS=--output_base=C:/b" >> "$GITHUB_ENV"
            echo "BAZEL_FLAGS=--legacy_external_runfiles --host_platform=@bazel-diff//platforms:windows_msvc --experimental_platform_in_output_dir --experimental_override_name_platform_in_output_dir=@bazel-diff//platforms:windows_msvc=w" >> "$GITHUB_ENV"
          else
            echo "BAZEL_STARTUP_FLAGS=" >> "$GITHUB_ENV"
            echo "BAZEL_FLAGS=" >> "$GITHUB_ENV"
          fi
      - name: Fetch the incompatible flags BCR tests for Bazel ${{ matrix.bazel }}
        run: |
          curl -fsSL --retry 5 --retry-delay 2 \
            https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/incompatible_flags.yml \
            -o "$TMP/incompatible_flags.yml"
          py=$(command -v python3 || command -v python)
          "$py" tools/bcr_incompatible_flags.py --file "$TMP/incompatible_flags.yml" \
            "${{ matrix.bazel }}" > "$TMP/incompatible_flags.txt"
          echo "BCR tests these flags on Bazel ${{ matrix.bazel }}:"
          cat "$TMP/incompatible_flags.txt"
      - name: Build BCR verify_targets as a consumer
        working-directory: ${{ runner.temp }}/consumer
        # Keep in sync with the build_targets in .bcr/presubmit.yml.
        run: bazelisk $BAZEL_STARTUP_FLAGS build $BAZEL_FLAGS @bazel-diff//:bazel-diff @bazel-diff//:bazel-diff-rust
      - name: Build once per incompatible flag, as BCR presubmit does
        working-directory: ${{ runner.temp }}/consumer
        run: |
          failed=()
          while IFS= read -r flag; do
            # Python writes CRLF on Windows; a trailing CR makes Bazel reject
            # the flag as unrecognized against its own name.
            flag=${flag%$'\r'}
            [ -z "$flag" ] && continue
            echo "::group::bazel build $flag"
            if bazelisk $BAZEL_STARTUP_FLAGS build $BAZEL_FLAGS "$flag" @bazel-diff//:bazel-diff @bazel-diff//:bazel-diff-rust; then
              echo "passed with $flag"
            else
              failed+=("$flag")
            fi
            echo "::endgroup::"
          done < "$TMP/incompatible_flags.txt"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::BCR presubmit would fail: migration is needed for ${failed[*]}"
            exit 1
          fi
