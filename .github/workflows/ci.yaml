name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  # hermetic-llvm's Windows toolchain fetches the MSVC runtime and Windows SDK
  # only after these are set to 1. GitHub-hosted Windows runners already ship
  # Visual Studio and the Windows SDK, and hermetic-llvm's own CI sets both.
  BAZEL_MSVC_RUNTIME_VISUAL_STUDIO_EULA: '1'
  BAZEL_WINDOWS_SDK_EULA: '1'

# Preserve the Rust candidate, MSRV, E2E, and release-artifacts job names:
# master branch protection requires these checks.
jobs:
  # rules_rs pins rustc in MODULE.bazel. Bazel runs the tests, Clippy,
  # rustfmt, and Python/Go tooling.
  rust-candidate:
    name: Rust candidate (Bazel ${{ matrix.bazel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel: ['8.x', '9.x']
    steps:
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
      - name: Setup Bazelisk
        # Retries guard against transient proxy.golang.org/sum.golang.org module-fetch errors.
        run: |
          for i in 1 2 3; do
            go install github.com/bazelbuild/bazelisk@latest && break
            echo "bazelisk install failed (attempt $i); retrying in 10s..."
            sleep 10
          done
      - uses: actions/checkout@v4
      - name: Check Bazel build and tests
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        run: ~/go/bin/bazelisk test //:rust_tests //:rust_clippy_check //:rust_format_check //tools/... --enable_bzlmod=true --enable_workspace=false

  rust-candidate-e2e:
    name: Rust candidate E2E
    runs-on: ubuntu-latest
    steps:
      # //tests:e2e_test queries fixture workspaces with Java targets.
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
      - name: Setup Bazelisk
        # Pass Bazelisk to //tests:e2e_test so nested Bazel commands honor
        # USE_BAZEL_VERSION instead of using the outer Bazel binary.
        run: |
          for i in 1 2 3; do
            go install github.com/bazelbuild/bazelisk@latest && break
            echo "bazelisk install failed (attempt $i); retrying in 10s..."
            sleep 10
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "BAZEL=$(go env GOPATH)/bin/bazelisk" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Run native behavioral suite
        env:
          # Read twice: by the outer bazelisk, and by the nested one.
          USE_BAZEL_VERSION: '8.x'
        run: bazelisk test //tests:e2e_test --enable_bzlmod=true --enable_workspace=false

  # Check the generated E2E targets and the generator in //tools/e2e.
  e2e-split-regen:
    name: E2E split regen
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
      - name: Setup Bazelisk
        # Retries guard against transient proxy.golang.org/sum.golang.org module-fetch errors.
        run: |
          for i in 1 2 3; do
            go install github.com/bazelbuild/bazelisk@latest && break
            echo "bazelisk install failed (attempt $i); retrying in 10s..."
            sleep 10
          done
      - uses: actions/checkout@v4
      - name: Check the e2e test split is up to date
        env:
          USE_BAZEL_VERSION: '8.x'
        run: ~/go/bin/bazelisk test //tools/e2e:regen_check //tools/e2e:split_e2e_tests_test --enable_bzlmod=true --enable_workspace=false --test_output=errors

  rust-candidate-msrv:
    name: Rust candidate MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
      - name: Setup Bazelisk
        # Retries guard against transient proxy.golang.org/sum.golang.org module-fetch errors.
        run: |
          for i in 1 2 3; do
            go install github.com/bazelbuild/bazelisk@latest && break
            echo "bazelisk install failed (attempt $i); retrying in 10s..."
            sleep 10
          done
      - uses: actions/checkout@v4
      # Match Cargo.toml's rust-version. --extra_toolchains takes precedence
      # over registered toolchains. Clippy and rustfmt use the default compiler.
      - name: Check declared minimum Rust version
        env:
          USE_BAZEL_VERSION: '8.x'
        run: |
          ~/go/bin/bazelisk build //src:bazel-diff \
            --extra_toolchains=@bazel_diff_msrv_toolchains//rustc:all \
            --output_groups=-clippy_checks,-rustfmt_checks \
            --enable_bzlmod=true --enable_workspace=false

  # Enforce 90% line coverage for Rust and Go on Linux and macOS.
  coverage:
    name: Coverage (${{ matrix.os }}, Bazel ${{ matrix.bazel }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bazel: '8.x'
          - os: ubuntu-latest
            bazel: '9.x'
          - os: macos-latest
            bazel: '8.x'
          - os: macos-latest
            bazel: '9.x'
    steps:
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
        id: go
      - name: Setup Bazelisk
        # Retries guard against transient proxy.golang.org/sum.golang.org module-fetch errors.
        run: |
          for i in 1 2 3; do
            go install github.com/bazelbuild/bazelisk@latest && break
            echo "bazelisk install failed (attempt $i); retrying in 10s..."
            sleep 10
          done
          export PATH=$PATH:$(go env GOPATH)/bin
      - uses: actions/checkout@v4
      - name: Build license target
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        run: ~/go/bin/bazelisk build //:license --enable_bzlmod=true --enable_workspace=false
      - name: Run bazel-diff tests with coverage
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        # Retries guard against transient toolchain/crate fetch errors failing the whole job.
        run: |
          for i in 1 2 3; do
            ~/go/bin/bazelisk coverage --combined_report=lcov //src:cli_tests //src:rust_tests //tools:coverage_check_test //tools/coverage/... //tools/go/... --enable_bzlmod=true --enable_workspace=false && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "coverage run failed (attempt $i); retrying in 15s..."
            sleep 15
          done
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}-bazel-${{ matrix.bazel }}
          path: bazel-out/_coverage/_coverage_report.dat
          if-no-files-found: warn
      - name: Enforce coverage threshold (>= 90% main-source line coverage)
        env:
          # Reuse the coverage step's Bazel version and output directory.
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
          COVERAGE_THRESHOLD: '90'
        run: ~/go/bin/bazelisk run //tools:coverage-check -- --badge-json coverage.json bazel-out/_coverage/_coverage_report.dat
      - name: Enforce Go coverage threshold (>= 90% line coverage under tools/go/)
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
        # Enforce coverage for tools/go/ independently of Rust coverage.
        run: ~/go/bin/bazelisk run //tools:coverage-check -- --include tools/go/ --threshold 90 bazel-out/_coverage/_coverage_report.dat
      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.os }}-bazel-${{ matrix.bazel }}
          path: bazel-testlogs/
          if-no-files-found: warn
  # Runs the example script end to end against this repository with supported
  # source-build Bazel versions.
  run-example:
    # extra_flags distinguishes rows with the same OS and Bazel version.
    name: Run example (${{ matrix.os }}, Bazel ${{ matrix.bazel }}, ${{ matrix.extra_flags || 'default flags' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bazel: '8.5.0'
            disable_workspace: 'true'
            extra_flags: ''
          - os: ubuntu-latest
            bazel: '8.x'
            disable_workspace: 'true'
            extra_flags: ''
          - os: ubuntu-latest
            bazel: '8.x'
            disable_workspace: 'true'
            extra_flags: '--incompatible_disable_native_repo_rules'
          - os: ubuntu-latest
            bazel: '9.x'
            disable_workspace: 'true'
            extra_flags: ''
          - os: ubuntu-latest
            bazel: '9.x'
            disable_workspace: 'true'
            extra_flags: '--incompatible_disable_native_repo_rules'
          - os: windows-latest
            bazel: '8.x'
            disable_workspace: 'true'
            extra_flags: ''
          - os: windows-latest
            bazel: '9.x'
            disable_workspace: 'true'
            extra_flags: ''
    steps:
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
        id: go
      - name: Setup Bazelisk (Linux/macOS)
        if: runner.os != 'Windows'
        # Retries guard against transient proxy.golang.org/sum.golang.org module-fetch errors.
        run: |
          for i in 1 2 3; do
            go install github.com/bazelbuild/bazelisk@latest && break
            echo "bazelisk install failed (attempt $i); retrying in 10s..."
            sleep 10
          done
          export PATH=$PATH:$(go env GOPATH)/bin
      - name: Setup Bazelisk (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            go install github.com/bazelbuild/bazelisk@latest
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "bazelisk install failed (attempt $i); retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          $env:PATH = "$env:PATH;$(go env GOPATH)\bin"
          echo "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run bazel-diff example script (Linux)
        if: runner.os != 'Windows'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
          BAZEL_DIFF_DISABLE_WORKSPACE: ${{ matrix.disable_workspace }}
          BAZEL_DIFF_FORCE_CHECKOUT: true
          BAZEL_EXTRA_COMMAND_OPTIONS: ${{ matrix.extra_flags }}
        # Retries guard against transient release-asset fetch errors (e.g. a 500 from
        # GitHub Releases downloading Bazel module deps).
        run: |
          for i in 1 2 3; do
            ./bazel-diff-example.sh "$GITHUB_WORKSPACE" ~/go/bin/bazelisk $(git rev-parse HEAD~1) $(git rev-parse HEAD) && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "example script failed (attempt $i); retrying in 15s..."
            sleep 15
          done
      - name: Run bazel-diff example script (Windows)
        if: runner.os == 'Windows'
        env:
          USE_BAZEL_VERSION: ${{ matrix.bazel }}
          BAZEL_DIFF_DISABLE_WORKSPACE: ${{ matrix.disable_workspace }}
          BAZEL_DIFF_FORCE_CHECKOUT: true
          BAZEL_EXTRA_COMMAND_OPTIONS: ${{ matrix.extra_flags }}
        shell: pwsh
        # Retries guard against transient release-asset fetch errors (e.g. a 500 from
        # GitHub Releases downloading Bazel module deps).
        #
        # Keep Windows output paths short for the build and nested queries.
        # A startup option cannot live in a --config.
        run: |
          New-Item -ItemType Directory -Force -Path "$env:ProgramData" | Out-Null
          Add-Content -Path "$env:ProgramData\bazel.bazelrc" -Value "startup --output_user_root=C:/b"
          $prevRev = git rev-parse HEAD~1
          $currRev = git rev-parse HEAD
          for ($i = 1; $i -le 3; $i++) {
            .\bazel-diff-example.ps1 -WorkspacePath "$env:GITHUB_WORKSPACE" -BazelPath "$env:USERPROFILE\go\bin\bazelisk.exe" -PreviousRevision $prevRev -FinalRevision $currRev
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { exit 1 }
            Write-Host "example script failed (attempt $i); retrying in 15s..."
            Start-Sleep -Seconds 15
          }
  # Build the release assets on every PR. release.yaml publishes them.
  release-artifacts:
    # Keep this check name stable for branch protection.
    name: release-artifacts (${{ matrix.os }})
    needs: [coverage]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Match //release:bazel-diff-rust asset names. Linux configs use musl;
        # Windows startup flags keep output paths short.
        include:
          - os: ubuntu-latest
            rust_asset: bazel-diff-rust-linux-amd64
            release_config: release-linux
            bazel_startup_flags: ''
            bazel_extra_flags: ''
            upload_archive: true
          - os: macos-latest
            rust_asset: bazel-diff-rust-macos-arm64
            release_config: release
            bazel_startup_flags: ''
            bazel_extra_flags: ''
            upload_archive: false
          - os: windows-latest
            rust_asset: bazel-diff-rust-windows-amd64.exe
            release_config: release
            bazel_startup_flags: '--output_user_root=C:/b'
            bazel_extra_flags: '--legacy_external_runfiles'
            upload_archive: false
    steps:
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
        id: go
      - name: Setup Bazelisk (Linux/macOS)
        if: runner.os != 'Windows'
        # Retries guard against transient proxy.golang.org/sum.golang.org module-fetch errors.
        run: |
          for i in 1 2 3; do
            go install github.com/bazelbuild/bazelisk@latest && break
            echo "bazelisk install failed (attempt $i); retrying in 10s..."
            sleep 10
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Setup Bazelisk (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            go install github.com/bazelbuild/bazelisk@latest
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "bazelisk install failed (attempt $i); retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@v4
      # Use the same archive script as release_prep.sh.
      - name: Build release source archive
        if: matrix.upload_archive
        run: .github/workflows/pack_release_archive.sh archives/release.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.upload_archive
        with:
          name: release.tar.gz
          path: archives/release.tar.gz
          if-no-files-found: error
      # .bazelrc defines release configs; //release:bazel-diff-rust names assets.
      - name: Build Rust binary
        shell: bash
        env:
          # Prevent Git Bash from rewriting Bazel target labels as Windows paths.
          MSYS2_ARG_CONV_EXCL: '//'
        run: bazelisk ${{ matrix.bazel_startup_flags }} build //release:bazel-diff-rust --config=${{ matrix.release_config }} ${{ matrix.bazel_extra_flags }}
      - name: Validate Linux release binary
        if: runner.os == 'Linux'
        run: |
          .github/workflows/assert_static_binary.sh "bazel-bin/release/${{ matrix.rust_asset }}"
          "bazel-bin/release/${{ matrix.rust_asset }}" --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rust_asset }}
          path: bazel-bin/release/${{ matrix.rust_asset }}
          if-no-files-found: error
      # Keep both Linux assets in the required release-artifacts (ubuntu-latest) job.
      - name: Build Rust binary (linux-arm64)
        if: runner.os == 'Linux'
        run: |
          bazelisk build //release:bazel-diff-rust --config=release-linux-arm64
          .github/workflows/assert_static_binary.sh bazel-bin/release/bazel-diff-rust-linux-arm64
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: bazel-diff-rust-linux-arm64
          path: bazel-bin/release/bazel-diff-rust-linux-arm64
          if-no-files-found: error
