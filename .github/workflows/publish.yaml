# Publish new releases to Bazel Central Registry.
name: Publish to BCR
on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      BCR_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: git tag being released
        required: true
        type: string
      templates_ref:
        description: >-
          git ref to read the .bcr templates from instead of tag_name. Use it to
          republish a release whose presubmit.yml or other templates had errors;
          the publish force-pushes the existing registry PR branch, which also
          re-runs its presubmit. Only works while the release is still a draft:
          releases are immutable once published, so re-uploading the attestation
          assets fails, and the registry rejects an entry without attestations.
        required: false
        type: string
jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.2.0
    with:
      tag_name: ${{ inputs.tag_name }}
      templates_ref: ${{ inputs.templates_ref }}
      # GitHub repository which is a fork of the upstream where the Pull Request will be opened.
      registry_fork: maxwellE/bazel-central-registry
      attest: true
      author_name: Maxwell Elliott
      author_email: maxwell@elliott.now
      committer_name: Maxwell Elliott
      committer_email: maxwell@elliott.now
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      # Necessary to push to the BCR fork, and to open a pull request against a registry
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
