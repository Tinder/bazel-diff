# Cut a release whenever a new tag is pushed or via workflow_dispatch.
# Uses bazel-contrib release ruleset: build, attest, and publish to GitHub Releases.
# A separate matrix job attaches host-native Rust CLI binaries to the draft release.
#
# The test suites gate the release from two independent jobs -- `java-tests` and
# `rust-tests` -- rather than from one `bazel test //...` inside the reusable
# workflow's build job. They run concurrently on their own runners, so a Kotlin
# failure no longer cancels the Rust suite's results (or vice versa): a release
# candidate gets both verdicts from one run instead of one verdict at a time.
# It also splits the two long suites -- //cli:E2ETest and //tests:e2e_test --
# across two cold runners, each with its own 6h GitHub job limit.
#
# Between them the three test commands cover every test in //...; keep it that
# way when adding a package:
#   java-tests  //cli/...                                   (Kotlin/Java)
#   rust-tests  //src/..., //tests/..., //tools/coverage/..., the Rust lint
#               gates //:rust_clippy_check and //:rust_format_check
#   release     //tools:all, //tools/e2e/..., //tools/go/...
#                                                   (Python/Go release tooling)
name: Release
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag being released
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  # The Kotlin/Java half of the release gate. //cli/... is the whole JVM CLI,
  # including //cli:E2ETest (timeout = "eternal"), which is why this suite gets
  # a runner to itself. Java is set up explicitly even though .bazelrc pins a
  # hermetic --java_runtime_version for tests, so this job matches what the
  # `test-jre21` job in ci.yaml already runs these suites under.
  java-tests:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
      - name: Setup Bazelisk
        run: |
          go install github.com/bazelbuild/bazelisk@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # No USE_BAZEL_VERSION: bazelisk takes the version from .bazelversion,
      # which is the one a release is cut with. --config=no-test-timeouts is in
      # .bazelrc; it is what keeps the long suites from timing out on a cold
      # release runner (see the comment on that config).
      - name: Run Kotlin/Java tests
        run: bazelisk test //cli/... --config=no-test-timeouts
  # The Rust half: the three Rust packages plus the two lint gates, which live
  # in the root package because they pin their own roots (see //BUILD). The
  # packages are named recursively rather than through the //:rust_tests suite
  # ci.yaml uses, so a Rust test added to //src or //tests is in the release
  # gate whether or not it also gets added to that hand-maintained suite.
  #
  # //tests:e2e_test spawns a nested Bazel per fixture workspace, so this job
  # needs the Java and $BAZEL setup that `rust-candidate-e2e` in ci.yaml uses --
  # without $BAZEL the suite shells out to the outer Bazel's own binary.
  # USE_BAZEL_VERSION keeps those nested Bazelisk processes on the same exact
  # release version the outer invocation reads from .bazelversion.
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
      - name: Setup Bazelisk
        run: |
          go install github.com/bazelbuild/bazelisk@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "BAZEL=$(go env GOPATH)/bin/bazelisk" >> "$GITHUB_ENV"
          echo "USE_BAZEL_VERSION=$(<.bazelversion)" >> "$GITHUB_ENV"
      - name: Run Rust tests
        run: |
          bazelisk test \
            //src/... \
            //tests/... \
            //tools/coverage/... \
            //:rust_clippy_check \
            //:rust_format_check \
            --config=no-test-timeouts \
            --test_output=errors
      - name: Upload Rust test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-rust-test-logs
          path: bazel-testlogs/
          if-no-files-found: warn
  release:
    # Both suites gate the release, but neither gates the other: they run
    # concurrently and the reusable workflow starts only once both are green.
    needs: [java-tests, rust-tests]
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.4.0
    with:
      release_files: archives/*.*
      # Replaces the reusable workflow's default (`bazel test //...`), which is
      # the only way to change what its build job runs. The Kotlin and Rust
      # suites moved to the two jobs above; what is left is the Python and Go
      # release tooling, which is fast enough to keep here rather than spend a
      # third runner on. --config=no-test-timeouts is in .bazelrc.
      bazel_test_command: "bazel test //tools:all //tools/e2e/... //tools/go/... --config=no-test-timeouts"
      prerelease: false
      draft: true
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    permissions:
      id-token: write # Needed to attest provenance
      attestations: write # Needed to attest provenance
      contents: write # Needed to upload release files
    secrets: {}
  publish:
    needs: release
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
  rust-binaries:
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # bazel_startup_flags shortens the output root on Windows because MSVC's
        # link.exe is MAX_PATH-bound (260): under the default root the Rust
        # stdlib rlib ...\librustc_std_workspace_alloc-<hash>.rlib comes to 263
        # characters and the link fails with LNK1181. Keep in sync with the
        # `release-artifacts` job in ci.yaml, which is where this gets exercised
        # per-PR -- including release_config, which builds the Linux asset
        # statically against musl so it runs on any distribution rather than
        # requiring the runner's glibc or newer.
        include:
          - os: ubuntu-latest
            asset: bazel-diff-rust-linux-amd64
            release_config: release-musl
            bazel_startup_flags: ""
            bazel_extra_flags: ""
          - os: macos-latest
            asset: bazel-diff-rust-macos-arm64
            release_config: release
            bazel_startup_flags: ""
            bazel_extra_flags: ""
          - os: windows-latest
            asset: bazel-diff-rust-windows-amd64.exe
            release_config: release
            bazel_startup_flags: "--output_user_root=C:/b"
            bazel_extra_flags: "--legacy_external_runfiles"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: ^1.17
      - name: Setup Bazelisk (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          go install github.com/bazelbuild/bazelisk@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Setup Bazelisk (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install github.com/bazelbuild/bazelisk@latest
          echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # //release:bazel-diff-rust names the binary for the platform Bazel built
      # it for, so nothing here renames or relocates it: bazel-bin/release/ holds
      # the published asset, and `gh release upload` keeps that file name. The
      # build flags live in .bazelrc under matrix.release_config.
      - name: Build Rust binary
        shell: bash
        env:
          # Windows runs this under Git bash, whose MSYS runtime rewrites any
          # argument starting with `//package` into a `/package` Windows path --
          # Bazel then rejects "invalid package name '/release'". (`//:target`
          # survived only because it has no path-like segment to convert.)
          MSYS2_ARG_CONV_EXCL: '//'
        run: bazelisk ${{ matrix.bazel_startup_flags }} build //release:bazel-diff-rust --config=${{ matrix.release_config }} ${{ matrix.bazel_extra_flags }}
      # Last gate before the asset is published: a glibc-linked binary here
      # would strand every user on an older distribution than the runner.
      - name: Assert Linux binary is statically linked
        if: runner.os == 'Linux'
        run: .github/workflows/assert_static_binary.sh "bazel-bin/release/${{ matrix.asset }}"
      - name: Upload release asset
        shell: bash
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "bazel-bin/release/${{ matrix.asset }}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
  finalize:
    needs: [publish, rust-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
