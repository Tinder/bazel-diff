[package]
name = "bazel-diff"
version = "39.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Determine impacted Bazel targets between two revisions"
repository = "https://github.com/Tinder/bazel-diff"
build = "build.rs"
publish = false

[[bin]]
name = "bazel-diff"
path = "src/main.rs"

[features]
default = ["mimalloc", "vendored-protoc"]
vendored-protoc = ["dep:protoc-bin-vendored"]

[dependencies]
anyhow = "1.0"
attohttpc = { version = "=0.28.5", default-features = false, features = ["basic-auth", "tls-rustls-webpki-roots"] }
buffa = "0.9.1"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1.1"
# gcp_auth is async-only and brings hyper/tokio for its token requests. Its default features
# would add the OS trust store (rustls-native-certs); the serve binary trusts webpki-roots
# everywhere else, so that is selected instead. hyper-rustls is listed only to enable the
# `ring` provider gcp_auth's default feature set would otherwise have enabled.
gcp_auth = { version = "=0.12.3", default-features = false, features = ["webpki-roots"] }
hex = "0.4"
hyper-rustls = { version = "0.27", default-features = false, features = ["ring"] }
# no_thp: build mimalloc without its MADV_HUGEPAGE hint. With the hint, the first touch of each
# mimalloc page faults in and zeroes a whole 2 MiB huge page, much of which generate-hashes never
# uses: peak RSS was 14-35% higher on the perf-proof workloads, for no CPU gain. Systems that turn
# huge pages on for every process (THP "always") are unaffected.
mimalloc = { version = "0.1", optional = true, features = ["no_thp"] }
# Already resolved for aws-creds; parses STS answers in web_identity.rs.
quick-xml = { version = "0.32", features = ["serialize"] }
rayon = "1.10"
rustls-pki-types = "1.15"
rust-s3 = { version = "=0.36.0", default-features = false, features = ["sync-rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "time", "net"] }
url = "2.5"
walkdir = "2.5"

[target.'cfg(all(target_arch = "aarch64", not(target_env = "msvc")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[build-dependencies]
buffa-build = "0.9.1"
protoc-bin-vendored = { version = "3.2", optional = true }

[dev-dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Mirrors the clippy policy in .bazelrc (the Bazel build is what CI checks);
# keep the two lists in step.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
case_sensitive_file_extension_comparisons = "allow"
implicit_hasher = "allow"

[profile.release]
lto = "thin"
strip = true
