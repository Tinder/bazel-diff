syntax = "proto3";

package analysis;

import "build.proto";

message Configuration {
  uint32 id = 1;
  string mnemonic = 2;
  string platform_name = 3;
  string checksum = 4;
  bool is_tool = 5;
}

message ConfiguredTarget {
  blaze_query.Target target = 1;
  Configuration configuration = 2;
  uint32 configuration_id = 3;
}

message KeyValuePair {
  string key = 1;
  string value = 2;
}

message AspectDescriptor {
  uint32 id = 1;
  string name = 2;
  repeated KeyValuePair parameters = 3;
}

message ConfiguredAspect {
  uint32 id = 1;
  AspectDescriptor aspect_descriptor = 2;
  blaze_query.ConfiguredRuleInput base_target = 3;
  repeated uint32 base_aspect_ids = 4;
  string execution_platform = 5;
  bool skips_rule_transition = 6;
}

message ConfiguredAspectResult {
  uint32 aspect_id = 1;
  repeated blaze_query.ConfiguredRuleInput configured_rule_input = 2;
}

message CqueryResult {
  repeated ConfiguredTarget results = 1;
  repeated Configuration configurations = 2;
  repeated ConfiguredAspect aspects = 3;
  repeated ConfiguredAspectResult aspect_results = 4;
  bool explicit_aspect_inputs = 5;
}
